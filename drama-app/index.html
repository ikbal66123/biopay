<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f">
<title>Episoda</title>
<meta name="description" content="Prototipe aplikasi drama pendek vertikal internasional dengan server per wilayah.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Noto+Nastaliq+Urdu:wght@400;700&family=Noto+Sans+Arabic:wght@400;700&family=Noto+Sans+Devanagari:wght@400;700&family=Noto+Sans+Bengali:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0f; --panel:#15151d; --panel-2:#1f1f2a; --line:#2b2b38; --text:#f5f4fa; --muted:#9b99ae;
    --accent:#ff2e63; --accent-2:#ffb800; --ok:#22c55e;
    --font:"Plus Jakarta Sans",system-ui,sans-serif;
  }
  :root[lang=ur]{ --font:"Noto Nastaliq Urdu","Noto Sans Arabic",system-ui,sans-serif; }
  :root[lang=ar]{ --font:"Noto Sans Arabic",system-ui,sans-serif; }
  :root[lang=hi]{ --font:"Noto Sans Devanagari","Plus Jakarta Sans",system-ui,sans-serif; }
  :root[lang=bn]{ --font:"Noto Sans Bengali","Plus Jakarta Sans",system-ui,sans-serif; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#000;color:var(--text);font-family:var(--font)}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
  #app{position:relative;max-width:430px;height:100dvh;margin:0 auto;background:var(--bg);overflow:hidden;display:flex;flex-direction:column}
  @media (min-width:600px){ body{display:flex;align-items:center;background:#05050a} #app{height:min(100dvh,900px);border-radius:28px;box-shadow:0 0 0 1px #24243a,0 30px 80px rgba(0,0,0,.6)} }
  .view{position:absolute;inset:0 0 64px 0;overflow-y:auto;display:none}
  .view.on{display:block}

  /* ---------- feed ---------- */
  #feedView{overflow:hidden}
  .feed{height:100%;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none}
  .feed::-webkit-scrollbar{display:none}
  .slide{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;background:#000}
  .slide canvas,.slide video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35) 0%,transparent 18%,transparent 55%,rgba(0,0,0,.85) 100%);pointer-events:none}
  .meta{position:absolute;inset-inline-start:16px;inset-inline-end:76px;bottom:22px}
  .series-name{font-weight:800;font-size:18px;line-height:1.35;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  .ep-pill{display:inline-block;margin-top:6px;font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.16);backdrop-filter:blur(6px)}
  .desc{font-size:13.5px;color:#e4e2ee;margin-top:8px;line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .watch-all{margin-top:10px;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;background:rgba(255,255,255,.12);border-radius:10px;padding:8px 12px;width:max-content;max-width:100%}
  .rail{position:absolute;inset-inline-end:10px;bottom:90px;display:flex;flex-direction:column;gap:18px;align-items:center}
  .rail button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;text-shadow:0 1px 4px rgba(0,0,0,.7)}
  .rail .ic{width:46px;height:46px;border-radius:50%;background:rgba(0,0,0,.35);display:grid;place-items:center;font-size:21px;backdrop-filter:blur(4px)}
  .rail .on .ic{background:var(--accent)}
  .bar{position:absolute;inset-inline:0;bottom:0;height:3px;background:rgba(255,255,255,.18)}
  .bar i{display:block;height:100%;width:0;background:var(--accent)}
  .paused-ic{position:absolute;inset:0;display:none;place-items:center;font-size:64px;color:rgba(255,255,255,.85);pointer-events:none}
  .slide.paused .paused-ic{display:grid}
  .topbar{position:absolute;inset-inline:0;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 12px) 14px 8px}
  .tabs-top{display:flex;gap:18px;font-weight:700;font-size:16px}
  .tabs-top span{opacity:.6} .tabs-top span.on{opacity:1;border-bottom:2px solid #fff;padding-bottom:3px}
  .server-pill{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:6px 11px;backdrop-filter:blur(6px)}
  .back{font-size:22px;width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.45)}

  /* ---------- nav ---------- */
  nav{position:absolute;inset-inline:0;bottom:0;height:64px;display:flex;background:#0d0d13;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:6}
  nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--muted);font-weight:600}
  nav button b{font-size:20px;font-weight:400;line-height:1}
  nav button.on{color:#fff}

  /* ---------- pages ---------- */
  .page{padding:calc(env(safe-area-inset-top) + 16px) 16px 24px}
  .page h1{font-size:22px;margin:4px 0 14px;font-weight:800}
  .page h2{font-size:15px;margin:22px 0 10px;font-weight:700}
  .chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
  .chip{white-space:nowrap;font-size:13px;font-weight:600;padding:7px 13px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line)}
  .chip.on{background:#fff;color:#000;border-color:#fff}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .card{position:relative;text-align:start}
  .card .poster{position:relative;aspect-ratio:3/4.4;border-radius:12px;overflow:hidden;background:var(--panel)}
  .card .poster canvas{width:100%;height:100%;display:block}
  .card .tag{position:absolute;top:6px;inset-inline-start:6px;font-size:10px;font-weight:800;padding:2px 7px;border-radius:6px;background:var(--accent)}
  .card .views{position:absolute;bottom:6px;inset-inline-start:6px;font-size:10.5px;font-weight:700;text-shadow:0 1px 4px #000}
  .card .t{font-size:12.5px;font-weight:700;margin-top:6px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .row{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none}
  .row .card{flex:0 0 31%}
  .empty{color:var(--muted);font-size:14px;padding:30px 0;text-align:center}
  .search{width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:11px 14px;color:#fff;font:inherit;outline:none;margin-bottom:12px}

  /* series detail */
  .hero{position:relative;height:260px;border-radius:16px;overflow:hidden}
  .hero canvas{width:100%;height:100%;display:block}
  .hero .over{position:absolute;inset:auto 0 0 0;padding:16px;background:linear-gradient(0deg,rgba(0,0,0,.85),transparent)}
  .hero .over b{font-size:20px;font-weight:800;line-height:1.4}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;border-radius:12px;padding:12px 16px;background:var(--panel-2);border:1px solid var(--line)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.gold{background:var(--accent-2);border-color:var(--accent-2);color:#1a1300}
  .eps{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
  .eps button{aspect-ratio:1;border-radius:10px;background:var(--panel-2);border:1px solid var(--line);font-weight:700;font-size:13px;position:relative}
  .eps button.done{border-color:var(--accent)}
  .eps button .lk{position:absolute;top:2px;inset-inline-end:3px;font-size:9px}

  /* profile */
  .coin-card{border-radius:16px;padding:18px;background:linear-gradient(135deg,#3a1d00,#6b3a00 60%,#a35a00);display:flex;align-items:center;justify-content:space-between;gap:12px}
  .coin-card .n{font-size:30px;font-weight:800}
  .list{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .list button{display:flex;align-items:center;gap:12px;padding:13px 14px;text-align:start;border-bottom:1px solid var(--line)}
  .list button:last-child{border-bottom:0}
  .list .sub{margin-inline-start:auto;color:var(--muted);font-size:13px}
  .list .flag{font-size:22px}
  .list button.sel{background:rgba(255,46,99,.12)}
  .packs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .pack{border-radius:14px;padding:14px 8px;background:var(--panel-2);border:1px solid var(--line);text-align:center}
  .pack b{display:block;font-size:20px} .pack small{color:var(--muted)}
  .pays{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .pays span{font-size:12.5px;font-weight:600;padding:6px 10px;border-radius:8px;background:var(--panel-2);border:1px solid var(--line)}
  .note{font-size:12px;color:var(--muted);margin-top:18px;line-height:1.6}

  /* sheets & overlays */
  .scrim{position:absolute;inset:0;background:rgba(0,0,0,.55);z-index:20;display:none}
  .scrim.on{display:block}
  .sheet{position:absolute;inset-inline:0;bottom:0;z-index:21;background:var(--panel);border-radius:20px 20px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .25s ease}
  .sheet.on{transform:none}
  .sheet h3{margin:0 0 4px;font-size:18px}
  .sheet .sub{color:var(--muted);font-size:13.5px;margin-bottom:16px}
  .sheet .actions{display:flex;flex-direction:column;gap:10px}
  .ad{position:absolute;inset:0;z-index:30;background:#111;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px}
  .ad.on{display:flex}
  .ad .box{width:100%;aspect-ratio:9/12;border-radius:16px;background:linear-gradient(135deg,#1d4ed8,#9333ea);display:grid;place-items:center;font-size:22px;font-weight:800}
  .ad .count{position:absolute;top:calc(env(safe-area-inset-top) + 14px);inset-inline-end:14px;font-size:13px;font-weight:700;background:rgba(255,255,255,.15);padding:6px 12px;border-radius:999px}
  .toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top) + 64px);transform:translateX(-50%);z-index:40;background:rgba(20,20,30,.95);border:1px solid var(--line);padding:9px 14px;border-radius:12px;font-size:13.5px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis}
  .toast.on{opacity:1}
  .proto{position:absolute;top:calc(env(safe-area-inset-top) + 52px);inset-inline-start:14px;z-index:4;font-size:10.5px;color:rgba(255,255,255,.7);background:rgba(0,0,0,.35);padding:3px 8px;border-radius:6px}
</style>
</head>
<body>
<div id="app">
  <!-- Untukmu / pemutar -->
  <section class="view on" id="feedView">
    <div class="topbar">
      <div class="tabs-top" id="feedTabs"></div>
      <button class="server-pill" id="serverPill"></button>
    </div>
    <div class="proto" id="protoNote"></div>
    <div class="feed" id="feed"></div>
  </section>

  <section class="view" id="exploreView"><div class="page" id="explorePage"></div></section>
  <section class="view" id="listView"><div class="page" id="listPage"></div></section>
  <section class="view" id="profileView"><div class="page" id="profilePage"></div></section>
  <section class="view" id="seriesView"><div class="page" id="seriesPage"></div></section>

  <nav id="nav"></nav>

  <div class="scrim" id="scrim"></div>
  <div class="sheet" id="sheet"></div>
  <div class="ad" id="ad"><div class="count" id="adCount"></div><div class="box" id="adBox"></div><div id="adText" style="color:var(--muted);font-size:13px"></div></div>
  <div class="toast" id="toast"></div>
</div>

    desc:{en:'Framed and forgotten, she rebuilds her life one step at a time to take everything back.',id:'Dijebak dan dilupakan, ia membangun hidupnya lagi untuk merebut semuanya kembali.',ur:'سازش کا شکار اور بھلا دی گئی، وہ قدم بہ قدم سب کچھ واپس لینے کے لیے اپنی زندگی دوبارہ بناتی ہے۔',hi:'फँसाई गई और भुला दी गई, वह सब कुछ वापस पाने के लिए कदम-दर-कदम अपनी ज़िंदगी फिर से बनाती है।',bn:'ফাঁসানো আর ভুলে যাওয়া এক নারী ধাপে ধাপে সব ফিরিয়ে নিতে আবার জীবন গড়ে।',tr:'Tuzağa düşürülüp unutulan kadın, her şeyi geri almak için hayatını adım adım yeniden kurar.',ar:'بعد أن لُفّقت لها التهم ونُسيت، تعيد بناء حياتها خطوة بخطوة لتستعيد كل شيء.'} },
];
const GENRES = ['romance','family','revenge','ceo','mystery','comedy'];
const EP_SECONDS = 30;     // durasi episode simulasi
const COINS_PER_EP = 30;   // harga buka satu episode
const AD_SECONDS = 5;      // durasi iklan simulasi
const CHECKIN_COINS = 20;

/* ============================================================
   State (disimpan di browser)
   ============================================================ */
const store = {
  get(k, d){ try { const v = localStorage.getItem('episoda.'+k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v){ try { localStorage.setItem('episoda.'+k, JSON.stringify(v)); } catch {} },
};
function detectRegion(){
  const l = (navigator.language || 'en').toLowerCase();
  if (l.startsWith('id') || l.startsWith('in')) return 'ID';
  if (l.startsWith('ur')) return 'PK';
  if (l.startsWith('hi')) return 'IN';
  if (l.startsWith('bn')) return 'BD';
  if (l.startsWith('tr')) return 'TR';
  if (l.startsWith('ar')) return 'ME';
  return 'GL';
}
const S = {
  region: store.get('region', null) || detectRegion(),
  lang: store.get('lang', null),
  coins: store.get('coins', 100),
  unlocked: store.get('unlocked', {}),    // { seriesId: [ep, ...] }
  list: store.get('list', []),            // seriesId[]
  liked: store.get('liked', []),
  history: store.get('history', {}),      // { seriesId: lastEp }
  checkin: store.get('checkin', ''),
  tab: 'feed', feedMode: 'foryou', genre: 'all', query: '', seriesId: null,
};
if (!S.lang) S.lang = REGIONS[S.region].lang;
const save = () => { for (const k of ['region','lang','coins','unlocked','list','liked','history','checkin']) store.set(k, S[k]); };

const t = (k, vars={}) => (I18N[S.lang][k] ?? I18N.en[k] ?? k).replace(/\{(\w+)\}/g, (_, v) => vars[v] ?? '');
const loc = obj => obj[S.lang] || obj.en || Object.values(obj)[0];
const regionName = r => loc(REGIONS[r].name);
const nfmt = n => new Intl.NumberFormat(REGIONS[S.region].num, { notation:'compact', maximumFractionDigits:1 }).format(n);
const inRegion = s => s.region === 'ALL' || s.region.includes(S.region);
const catalog = () => SERIES.filter(inRegion);
const byId = id => SERIES.find(s => s.id === id);
const isUnlocked = (s, ep) => ep <= s.free || (S.unlocked[s.id] || []).includes(ep);
const $ = q => document.querySelector(q);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);

/* ============================================================
   Cuplikan animasi pengganti video (sampai video drama sungguhan tersedia)
   ============================================================ */
function hash(str){ let h = 2166136261; for (const c of str) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return h >>> 0; }
function drawScene(ctx, w, h, s, ep, time){
  const r = hash(s.id + ':' + ep), rnd = i => ((Math.sin(r*0.0001 + i*12.9898) * 43758.5453) % 1 + 1) % 1;
  const [c1, c2] = s.pal;
  const g = ctx.createLinearGradient(0, 0, w*.3, h); g.addColorStop(0, c2); g.addColorStop(.55, c1); g.addColorStop(1, '#050507');
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
  // cahaya bokeh
  for (let i=0;i<14;i++){
    const x = rnd(i)*w + Math.sin(time*.3 + i)*w*.03, y = rnd(i+40)*h*.6, rr = (rnd(i+80)*.08 + .03)*w;
    const bg = ctx.createRadialGradient(x, y, 0, x, y, rr); bg.addColorStop(0, 'rgba(255,255,255,.22)'); bg.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = bg; ctx.beginPath(); ctx.arc(x, y, rr, 0, 7); ctx.fill();
  }
  // lantai
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(0, h*.78, w, h*.22);
  // dua tokoh (siluet), posisi & gerak berbeda tiap episode
  const sway = Math.sin(time*1.2) * w*.006, zoom = 1 + Math.min(.12, time*.004);
  const figure = (cx, scale, hue, lean) => {
    ctx.save(); ctx.translate(cx, h*.8); ctx.scale(scale*zoom, scale*zoom); ctx.rotate(lean);
    ctx.fillStyle = hue;
    ctx.beginPath(); ctx.ellipse(0, -h*.4, w*.065, w*.075, 0, 0, 7); ctx.fill();                       // kepala
    ctx.beginPath(); ctx.moveTo(-w*.12, 0); ctx.quadraticCurveTo(-w*.13, -h*.3, -w*.03, -h*.33);           // badan
    ctx.lineTo(w*.03, -h*.33); ctx.quadraticCurveTo(w*.13, -h*.3, w*.12, 0); ctx.closePath(); ctx.fill();
    ctx.restore();
  };
  const near = rnd(5) > .5;
  figure(w*(.32 + rnd(6)*.06) + sway, near ? 1.08 : .92, 'rgba(8,8,12,.92)', -.03 + sway*.002);
  figure(w*(.68 - rnd(7)*.06) - sway, near ? .92 : 1.08, 'rgba(14,10,16,.88)', .03 - sway*.002);
  // kilatan dramatis menjelang akhir episode (cliffhanger)
  const end = time / EP_SECONDS;
  if (end > .85){ ctx.fillStyle = `rgba(255,255,255,${(Math.sin(time*18)+1)*.05})`; ctx.fillRect(0,0,w,h); }
  // vinyet
  const v = ctx.createRadialGradient(w/2, h*.45, h*.2, w/2, h*.45, h*.8); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.55)');
  ctx.fillStyle = v; ctx.fillRect(0,0,w,h);
}
function poster(s, w=180, h=264){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  drawScene(c.getContext('2d'), w, h, s, 1, 2);
  return c;
}

/* ============================================================
   Feed vertikal (Untukmu & pemutar per serial)
   ============================================================ */
let slides = [], active = -1, rafId = 0, lastFrame = 0;
function feedItems(){
  if (S.feedMode === 'series'){
    const s = byId(S.seriesId); const start = S.startEp || 1;
    return Array.from({ length: s.eps - start + 1 }, (_, i) => ({ s, ep: start + i }));
  }
  // Untukmu: episode lanjutan dari riwayat dulu, lalu episode 1 dari semua drama di server ini
  const cat = catalog().slice().sort((a,b) => hash(a.id + S.region) - hash(b.id + S.region));
  const cont = cat.filter(s => S.history[s.id]).map(s => ({ s, ep: Math.min(s.eps, S.history[s.id]) }));
  return [...cont, ...cat.filter(s => !S.history[s.id]).map(s => ({ s, ep: 1 }))];
}
function buildFeed(){
  const feed = $('#feed'); feed.innerHTML = ''; slides = [];
  for (const it of feedItems()){
    const el = document.createElement('div'); el.className = 'slide';
    const media = it.s.video ? Object.assign(document.createElement('video'), { src: it.s.video, playsInline:true, muted:true, loop:false }) : document.createElement('canvas');
    el.append(media);
    el.insertAdjacentHTML('beforeend', `<div class="shade"></div><div class="paused-ic">▶</div>
      <div class="meta">
        <div class="series-name">${esc(loc(it.s.title))}</div>
        <span class="ep-pill">${t('episode')} ${it.ep}/${it.s.eps} · ${isUnlocked(it.s, it.ep) ? (it.ep <= it.s.free ? t('free') : '✓') : '🔒 ' + t('locked')}</span>
        <div class="desc">${esc(loc(it.s.desc))}</div>
        ${S.feedMode === 'foryou' ? `<button class="watch-all" data-act="series">▤ ${t('nEps', { n: it.s.eps })} · ${t('watch')}</button>` : ''}
      </div>
      <div class="rail">
        <button data-act="like" class="${S.liked.includes(it.s.id) ? 'on' : ''}"><span class="ic">♥</span><span>${nfmt(it.s.views/12)}</span></button>
        <button data-act="list" class="${S.list.includes(it.s.id) ? 'on' : ''}"><span class="ic">＋</span><span>${t('myList')}</span></button>
        <button data-act="eps"><span class="ic">▤</span><span>${t('ep')} ${it.ep}</span></button>
        <button data-act="share"><span class="ic">↗</span><span>${t('share')}</span></button>
      </div>
      <div class="bar"><i></i></div>`);
    const slide = { el, media, ...it, time: 0, playing: true };
    el.addEventListener('click', e => {
      const b = e.target.closest('[data-act]');
      if (!b) return togglePlay(slide);
      e.stopPropagation(); railAction(b.dataset.act, slide, b);
    });
    slides.push(slide); feed.append(el);
  }
  sizeCanvases();
  feed.scrollTop = 0; active = -1; observe();
}
function sizeCanvases(){
  const r = $('#feed').getBoundingClientRect(), dpr = Math.min(2, devicePixelRatio || 1);
  for (const sl of slides) if (sl.media.tagName === 'CANVAS'){ sl.media.width = Math.round(r.width*dpr*.6); sl.media.height = Math.round(r.height*dpr*.6); drawScene(sl.media.getContext('2d'), sl.media.width, sl.media.height, sl.s, sl.ep, 1); }
}
let io;
function observe(){
  io?.disconnect();
  io = new IntersectionObserver(es => { for (const e of es) if (e.isIntersecting && e.intersectionRatio > .6) activate(slides.findIndex(s => s.el === e.target)); }, { root: $('#feed'), threshold: [.6] });
  slides.forEach(s => io.observe(s.el));
}
function activate(i){
  if (i === active || i < 0) return;
  const prev = slides[active]; if (prev?.media.tagName === 'VIDEO') prev.media.pause();
  active = i; const sl = slides[i];
  if (!isUnlocked(sl.s, sl.ep)){ sl.playing = false; sl.el.classList.add('paused'); openUnlock(sl); }
  else { sl.playing = true; sl.el.classList.remove('paused'); if (sl.media.tagName === 'VIDEO') sl.media.play().catch(()=>{}); markWatched(sl); }
}
function markWatched(sl){ S.history[sl.s.id] = Math.max(S.history[sl.s.id] || 0, sl.ep); save(); }
function togglePlay(sl){
  if (!isUnlocked(sl.s, sl.ep)) return openUnlock(sl);
  sl.playing = !sl.playing; sl.el.classList.toggle('paused', !sl.playing);
  if (sl.media.tagName === 'VIDEO') sl.playing ? sl.media.play().catch(()=>{}) : sl.media.pause();
}
function tick(now){
  rafId = requestAnimationFrame(tick);
  const dt = Math.min(.1, (now - lastFrame) / 1000); lastFrame = now;
  const sl = slides[active]; if (!sl || S.tab !== 'feed' || !sl.playing || sheetOpen()) return;
  if (sl.media.tagName === 'VIDEO'){ sl.time = sl.media.currentTime; if (sl.media.ended) return finishEpisode(sl); }
  else { sl.time += dt; drawScene(sl.media.getContext('2d'), sl.media.width, sl.media.height, sl.s, sl.ep, sl.time); if (sl.time >= EP_SECONDS) return finishEpisode(sl); }
  const dur = sl.media.tagName === 'VIDEO' ? (sl.media.duration || EP_SECONDS) : EP_SECONDS;
  sl.el.querySelector('.bar i').style.width = Math.min(100, sl.time/dur*100) + '%';
}
function finishEpisode(sl){
  sl.playing = false; sl.time = 0;
  const next = slides[active+1];
  if (next) next.el.scrollIntoView({ behavior:'smooth' });
}
function railAction(act, sl, btn){
  const id = sl.s.id;
  if (act === 'like'){ toggleIn(S.liked, id); btn.classList.toggle('on'); save(); }
  if (act === 'list'){ const on = toggleIn(S.list, id); btn.classList.toggle('on', on); toast(on ? t('added') : t('removed')); save(); }
  if (act === 'eps' || act === 'series') openSeries(id);
  if (act === 'share'){
    const text = t('shareText', { t: loc(sl.s.title) });
    if (navigator.share) navigator.share({ title:'Episoda', text }).catch(()=>{});
    else { navigator.clipboard?.writeText(`${text} – https://episoda.app/s/${id}/${sl.ep}`).catch(()=>{}); toast(t('copied')); }
  }
}
const toggleIn = (arr, v) => { const i = arr.indexOf(v); if (i >= 0){ arr.splice(i,1); return false; } arr.push(v); return true; };

/* ============================================================
   Buka episode: iklan, koin, beli koin
   ============================================================ */
let sheetFor = null;
const sheetOpen = () => $('#sheet').classList.contains('on') || $('#ad').classList.contains('on');
function openSheet(html){ $('#sheet').innerHTML = html; $('#sheet').classList.add('on'); $('#scrim').classList.add('on'); }
function closeSheet(){ $('#sheet').classList.remove('on'); $('#scrim').classList.remove('on'); sheetFor = null; }
$('#scrim').onclick = closeSheet;
function openUnlock(sl){
  sheetFor = sl;
  openSheet(`<h3>🔒 ${t('unlockTitle', { n: sl.ep })}</h3><div class="sub">${esc(loc(sl.s.title))} · ${t('unlockSub')}</div>
    <div class="actions">
      <button class="btn primary" id="uAd">▶ ${t('watchAd', { s: AD_SECONDS })}</button>
      <button class="btn gold" id="uCoin">🪙 ${t('useCoins', { c: COINS_PER_EP })} · ${t('balance')}: ${S.coins}</button>
      <button class="btn" id="uBuy">${t('buyCoins')}</button>
      <button class="btn" id="uCancel">${t('cancel')}</button>
    </div>`);
  $('#uAd').onclick = () => playAd(() => unlockEp(sl));
  $('#uCoin').onclick = () => { if (S.coins < COINS_PER_EP) return toast(t('notEnough')); S.coins -= COINS_PER_EP; unlockEp(sl); };
  $('#uBuy').onclick = () => openShop(sl);
  $('#uCancel').onclick = closeSheet;
}
function unlockEp(sl){
  (S.unlocked[sl.s.id] ||= []).push(sl.ep); save(); closeSheet(); toast(t('unlocked'));
  sl.el.querySelector('.ep-pill').textContent = `${t('episode')} ${sl.ep}/${sl.s.eps} · ✓`;
  if (slides[active] === sl){ sl.playing = true; sl.el.classList.remove('paused'); if (sl.media.tagName === 'VIDEO') sl.media.play().catch(()=>{}); markWatched(sl); }
  if (S.tab === 'series') renderSeries();
}
function playAd(done){
  closeSheet(); const ad = $('#ad'); let s = AD_SECONDS;
  $('#adBox').textContent = t('adSponsor'); $('#adText').textContent = t('adSkipIn');
  ad.classList.add('on'); $('#adCount').textContent = t('adLabel', { s });
  const iv = setInterval(() => { s--; $('#adCount').textContent = t('adLabel', { s }); if (s <= 0){ clearInterval(iv); ad.classList.remove('on'); done(); } }, 1000);
}
function openShop(back){
  const R = REGIONS[S.region];
  openSheet(`<h3>🪙 ${t('buyCoins')}</h3><div class="sub">${t('balance')}: <b>${S.coins}</b> · ${R.flag} ${esc(regionName(S.region))}</div>
    <div class="packs">${R.packs.map(([c,p],i) => `<button class="pack" data-i="${i}"><b>${c}</b><small>${t('coins')}</small><div style="margin-top:6px;font-weight:700">${esc(p)}</div></button>`).join('')}</div>
    <div style="margin-top:14px;font-size:13px;color:var(--muted)">${t('payWith')}</div>
    <div class="pays">${R.pay.map(p => `<span>${esc(p)}</span>`).join('')}</div>
    <div class="note">${t('pricesNote')}</div>
    <div class="actions" style="margin-top:12px"><button class="btn" id="shopClose">${t('cancel')}</button></div>`);
  document.querySelectorAll('.pack').forEach(b => b.onclick = () => {
    const [c] = R.packs[+b.dataset.i]; S.coins += c; save(); toast(t('purchased', { c }));
    if (back) openUnlock(back); else { closeSheet(); renderProfile(); }
  });
  $('#shopClose').onclick = () => back ? openUnlock(back) : closeSheet();
}

/* ============================================================
   Halaman: Jelajah, Daftarku, Profil, Detail serial
   ============================================================ */
function cardHTML(s){
  return `<button class="card" data-s="${s.id}"><div class="poster" data-p="${s.id}"><span class="tag">${t(s.tag)}</span><span class="views">▶ ${nfmt(s.views)}</span></div><div class="t">${esc(loc(s.title))}</div></button>`;
}
function hydrateCards(root){
  root.querySelectorAll('[data-p]').forEach(p => p.prepend(poster(byId(p.dataset.p))));
  root.querySelectorAll('.card').forEach(c => c.onclick = () => openSeries(c.dataset.s));
}
function renderExplore(){
  const cat = catalog(), q = S.query.trim().toLowerCase();

  document.querySelectorAll('[data-g]').forEach(c => c.onclick = () => { S.genre = c.dataset.g; renderExplore(); });
  const qi = $('#q'); qi.oninput = () => { S.query = qi.value; const pos = qi.selectionStart; renderExplore(); const n = $('#q'); n.focus(); n.setSelectionRange(pos, pos); };

function renderList(){
  const mine = S.list.map(byId).filter(Boolean), hist = Object.keys(S.history).map(byId).filter(s => s && inRegion(s));
  $('#listPage').innerHTML = `<h1>${t('myList')}</h1>
    ${hist.length ? `<h2>${t('continueW')}</h2><div class="row">${hist.map(cardHTML).join('')}</div>` : ''}
    <h2>${t('myList')}</h2>${mine.length ? `<div class="grid">${mine.map(cardHTML).join('')}</div>` : `<div class="empty">${t('emptyList')}</div>`}`;
  hydrateCards($('#listPage'));
}
function renderProfile(){

    <h2>🌐 ${t('server')}</h2>

function openSeries(id){ S.seriesId = id; showTab('series'); }

    <div class="eps">${Array.from({ length: s.eps }, (_, i) => { const ep = i+1; return `<button data-ep="${ep}" class="${ep <= last ? 'done' : ''}">${ep}${isUnlocked(s, ep) ? '' : '<span class="lk">🔒</span>'}</button>`; }).join('')}</div>`;
  $('.hero').prepend(poster(s, 400, 260));
  $('#back').onclick = () => showTab(S.prevTab || 'feed');
  $('#playFrom').onclick = () => playSeries(s.id, Math.max(1, Math.min(s.eps, last || 1)));
  $('#addList').onclick = () => { const on = toggleIn(S.list, s.id); save(); toast(on ? t('added') : t('removed')); renderSeries(); };
  document.querySelectorAll('[data-ep]').forEach(b => b.onclick = () => playSeries(s.id, +b.dataset.ep));
}
function playSeries(id, ep){ S.feedMode = 'series'; S.seriesId = id; S.startEp = ep; showTab('feed'); }

/* ============================================================
   Navigasi, server, bahasa
   ============================================================ */
const NAV = [['feed','⌂','forYou'],['explore','⌕','explore'],['list','♡','myList'],['profile','◉','profile']];
function renderNav(){
  $('#nav').innerHTML = NAV.map(([k,ic,l]) => `<button data-t="${k}" class="${S.tab===k || (k==='feed' && S.tab==='series' && false) ?'on':''}"><b>${ic}</b>${t(l)}</button>`).join('');
  document.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { if (b.dataset.t === 'feed'){ S.feedMode = 'foryou'; } showTab(b.dataset.t, true); });
}
function showTab(tab, fromNav){
  if (tab === 'series' && S.tab !== 'series') S.prevTab = S.tab;
  const was = S.tab; S.tab = tab;
  document.querySelectorAll('.view').forEach(v => v.classList.remove('on'));
  $('#' + (tab === 'feed' ? 'feedView' : tab + 'View')).classList.add('on');
  if (tab === 'feed'){ renderTopbar(); if (fromNav || was !== 'feed' || !slides.length) buildFeed(); }
  if (tab === 'explore') renderExplore();
  if (tab === 'list') renderList();
  if (tab === 'profile') renderProfile();
  if (tab === 'series') renderSeries();
  renderNav();
}
function renderTopbar(){
  const series = S.feedMode === 'series';
  $('#feedTabs').innerHTML = series
    ? `<button class="back" id="feedBack">${document.documentElement.dir === 'rtl' ? '→' : '←'}</button>`
    : `<span class="on">${t('forYou')}</span>`;
  if (series) $('#feedBack').onclick = () => openSeries(S.seriesId);
  $('#serverPill').innerHTML = `${REGIONS[S.region].flag} ${esc(regionName(S.region))} ▾`;
  $('#protoNote').textContent = t('proto');
}
$('#serverPill').onclick = () => {
  openSheet(`<h3>🌐 ${t('server')}</h3><div class="list" style="margin-top:12px">${Object.entries(REGIONS).map(([k,R]) => `<button data-r="${k}" class="${k===S.region?'sel':''}"><span class="flag">${R.flag}</span><span>${esc(regionName(k))}</span><span class="sub">${LANG_NAMES[R.lang]}</span></button>`).join('')}</div>`);
  document.querySelectorAll('#sheet [data-r]').forEach(b => b.onclick = () => { closeSheet(); setRegion(b.dataset.r); });
};
function setRegion(r){
  S.region = r; S.lang = REGIONS[r].lang; S.feedMode = 'foryou'; S.genre = 'all'; S.query = ''; save();
  applyLang(); toast(t('serverChanged', { r: `${REGIONS[r].flag} ${regionName(r)}` }));
  if (S.tab === 'feed') buildFeed(); else if (S.tab === 'profile') renderProfile();
}
function applyLang(){
  document.documentElement.lang = S.lang; document.documentElement.dir = RTL.has(S.lang) ? 'rtl' : 'ltr';
  renderNav(); renderTopbar();
  if (S.tab === 'feed') buildFeed();
}
let toastT;
function toast(msg){ const el = $('#toast'); el.textContent = msg; el.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), 1800); }
addEventListener('resize', sizeCanvases);

applyLang(); showTab('feed'); requestAnimationFrame(tick);
window.__episoda = { S, SERIES, REGIONS, setRegion, showTab, openSeries };
</script>
</body>
</html>
